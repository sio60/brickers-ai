name: Deploy AI Services (Mac Studio)

# ============================================
# Mac Studio Self-hosted Runner (2026-02-18~)
# push to main → Mac Runner가 자동으로 pull + build + restart
# 수동 dispatch로 개별 서비스 배포 가능
# ============================================

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target:
        description: '배포 대상 (all / ai / blueprint / screenshot)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ai
          - blueprint
          - screenshot

jobs:
  deploy-mac:
    name: Deploy to Mac Studio
    runs-on: [self-hosted, mac]

    env:
      REPO_DIR: /Users/byeonjihwan/Documents/brickers/brickers-ai
      COMPOSE_DIR: /Users/byeonjihwan/Documents/brickers/local-configs/brickers-ai
      COMPOSE_FILE: /Users/byeonjihwan/Documents/brickers/local-configs/brickers-ai/docker-compose-mac.yml

    steps:
      - name: Determine target
        id: target
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "target=all" >> "$GITHUB_OUTPUT"
          else
            echo "target=${{ github.event.inputs.target }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull latest code
        run: |
          cd "$REPO_DIR"
          git fetch origin main
          git reset --hard origin/main

      - name: Write .env from GitHub Secrets
        run: |
          cat > "$COMPOSE_DIR/.env.local" <<'ENVEOF'
          TZ=Asia/Seoul

          # --- API Keys ---
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          TRIPO_API_KEY=${{ secrets.TRIPO_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL=${{ secrets.OPENAI_MODEL }}
          NANO_BANANA_MODEL=${{ secrets.NANO_BANANA_MODEL }}

          # --- S3 ---
          AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_PUBLIC_BASE_URL=${{ secrets.S3_PUBLIC_BASE_URL }}
          S3_PREFIX=uploads/ai-generated
          USE_S3=true

          # --- SQS (4개 Queue) ---
          AWS_SQS_REQUEST_QUEUE_URL=${{ secrets.AWS_SQS_REQUEST_QUEUE_URL }}
          AWS_SQS_RESULT_QUEUE_URL=${{ secrets.AWS_SQS_RESULT_QUEUE_URL }}
          AWS_SQS_PDF_QUEUE_URL=${{ secrets.AWS_SQS_PDF_QUEUE_URL }}
          AWS_SQS_SCREENSHOT_QUEUE_URL=${{ secrets.AWS_SQS_SCREENSHOT_QUEUE_URL }}
          AWS_SQS_ENABLED=true

          # --- Celery (Screenshot Worker) ---
          CELERY_SQS_SCREENSHOT_QUEUE_URL=${{ secrets.CELERY_SQS_SCREENSHOT_QUEUE_URL }}
          CELERY_SCREENSHOT_ENABLED=true
          SQS_POLL_INTERVAL=5
          SQS_MAX_MESSAGES=1
          SQS_VISIBILITY_TIMEOUT=1800
          SQS_WAIT_TIME=10

          # --- Backend ---
          BACKEND_URL=${{ secrets.BACKEND_URL }}

          # --- MongoDB / RAG ---
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          MONGODB_DB=${{ secrets.MONGODB_DB }}
          ATLAS_VECTOR_INDEX_MEMORY=co_scientist_memory_index
          HF_EMBED_MODEL=intfloat/multilingual-e5-small

          # --- Timeouts ---
          KIDS_TOTAL_TIMEOUT_SEC=1800
          TRIPO_WAIT_TIMEOUT_SEC=900

          # --- Internal Token ---
          INTERNAL_API_TOKEN=${{ secrets.INTERNAL_API_TOKEN }}

          # --- LangSmith ---
          LANGCHAIN_TRACING_V2=true
          LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_PROJECT=brickers-production

          # --- Screenshot / Blueprint 공통 ---
          S3_PREFIX_SCREENSHOT=uploads/screenshots
          LDVIEW_BIN=LDView
          LDRAWDIR=/usr/share/ldraw
          ENVEOF

      - name: Build and deploy services
        run: |
          TARGET="${{ steps.target.outputs.target }}"
          echo "Deploying target: $TARGET"

          case "$TARGET" in
            all)
              docker compose -f "$COMPOSE_FILE" up --build -d
              ;;
            ai)
              docker compose -f "$COMPOSE_FILE" up --build -d ai-server
              ;;
            blueprint)
              docker compose -f "$COMPOSE_FILE" up --build -d blueprint
              ;;
            screenshot)
              docker compose -f "$COMPOSE_FILE" up --build -d screenshot-api screenshot-worker
              ;;
          esac

      - name: Verify deployment
        run: |
          sleep 5
          echo "=== Running Containers ==="
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep brickers || true
          echo ""
          echo "=== Health Check ==="
          curl -sf http://localhost:8000/health && echo " AI Server OK" || echo " AI Server not ready"
          curl -sf http://localhost:8001/health && echo " Blueprint OK" || echo " Blueprint not ready"
          curl -sf http://localhost:8002/health && echo " Screenshot OK" || echo " Screenshot not ready"
